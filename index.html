<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clarity 3D Hero</title>

  <style>
    html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#ffffff; }
    canvas#webgl {
      position:fixed; inset:0; width:100%; height:100%; display:block; outline:none;
    }
    /* GUI hidden by default; press H to toggle */
    .root { position: absolute !important; top: 10px; right: 10px; z-index: 10; display: none; }
  </style>
</head>
<body>
  <canvas id="webgl"></canvas>

  <!-- import map: maps bare module names to CDN ESM files -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
      "GLTFLoader": "https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
    }
  }
  </script>

  <!-- main script (module) -->
  <script type="module" src="./main.js?v=icons"></script>
</body>
</html>
