<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity — 3D Hero</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #f0f0f0;
      font-family: system-ui, sans-serif;
    }

    #webgl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
      background: linear-gradient(to bottom, #eaeaea, #dcdcdc);
    }

    #overlay h1 {
      font-size: 15vw;
      font-weight: 900;
      color: #111;
      margin: 0;
      opacity: 0.9;
    }

    .lil-gui {
      z-index: 5 !important;
    }
  </style>
</head>
<body>
  <div id="overlay"><h1>Clarity</h1></div>
  <canvas id="webgl"></canvas>

  <!-- Importmap agar tidak error "Failed to resolve module specifier 'three'" -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
    }
  }
  </script>

  <!-- Panggil script utama -->
  <script type="module" src="./main.js?v=2"></script>
</body>
</html>
