<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarity 3D Hero</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: sans-serif;
      }

      canvas#webgl {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }

      /* Optional: sembunyikan GUI sampai tombol ditekan */
      .root {
        position: absolute !important;
        top: 10px;
        right: 10px;
        z-index: 10;
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- 🎨 Kanvas utama untuk Three.js -->
    <canvas id="webgl"></canvas>

    <!-- 🧩 Import map agar browser tahu sumber modul ES -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
          "GLTFLoader": "https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
        }
      }
    </script>

    <!-- ⚙️ Main script -->
    <script type="module" src="./main.js?v=final"></script>
  </body>
</html>
