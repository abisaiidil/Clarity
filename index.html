<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarity 3D Hero</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        font-family: "Inter", sans-serif;
        background-color: #f7f7f7;
      }

      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .hero-text {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .hero-text h1 {
        font-size: 14vw;
        font-weight: 900;
        color: #000;
        margin: 0;
        letter-spacing: -0.03em;
      }
    </style>
  </head>

  <body>
    <canvas id="webgl"></canvas>

    <div class="hero-text">
      <h1>CLARITY</h1>
    </div>

    <!-- hanya panggil satu module JS -->
    <script type="module" src="./main.js?v=1"></script>
  </body>
</html>
