<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarity 3D Hero</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background-color: #f5f5f5;
        font-family: "Inter", sans-serif;
      }

      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .hero-text {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .hero-text h1 {
        font-size: 14vw;
        font-weight: 900;
        margin: 0;
        letter-spacing: -0.03em;
        color: #000;
      }
    </style>
  </head>

  <body>
    <canvas id="webgl"></canvas>
    <div class="hero-text">
      <h1>CLARITY</h1>
    </div>

    <!-- ✅ Importmap agar browser tahu module path -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
    </script>

    <!-- ✅ Muat file JS utama -->
    <script type="module" src="./main.js?v=3"></script>
  </body>
</html>
